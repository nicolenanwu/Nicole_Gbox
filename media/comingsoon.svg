  <rect x="140" y="170" width="520" height="260" rx="22" fill="#020617" stroke="url(#accent)" stroke-width="1.5"/>

  <ellipse cx="400" cy="430" rx="180" ry="30" fill="#020617" filter="url(#glow)" opacity="0.7"/>

  <path d="M220 260 C260 220 320 220 360 260 S460 300 520 260" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 10" opacity="0.8"/>
