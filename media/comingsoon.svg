  <circle cx="304" cy="307" r="8" fill="#3f7ad6"/>
  <circle cx="332" cy="307" r="8" fill="#3f7ad6" opacity="0.8"/>
  <circle cx="360" cy="307" r="8" fill="#3f7ad6" opacity="0.6"/>
  <rect x="386" y="298" width="110" height="18" rx="9" fill="#111827"/>

